# Packages the Rust binary as a wheel so `pip install smbmc-exporter` (or
# `uvx smbmc-exporter`) keeps working. The version comes from Cargo.toml.
[project]
name = "smbmc-exporter"
dynamic = ["version"]
description = "Prometheus exporter for smbmc metrics"
authors = [
    {name="George Rawlinson", email="george@rawlinson.net.nz"},
]
readme = "README.md"
license = {text="GPL-3.0-only"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Rust",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
repository = "https://github.com/grawlinson/smbmc-exporter"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
