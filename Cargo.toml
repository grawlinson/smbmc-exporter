[package]
name = "smbmc-exporter"
version = "0.3.0"
description = "Prometheus exporter for Supermicro BMC metrics"
authors = ["George Rawlinson <george@rawlinson.net.nz>"]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/grawlinson/smbmc-exporter"
homepage = "https://github.com/grawlinson/smbmc-exporter"
keywords = ["prometheus", "exporter", "supermicro", "bmc", "ipmi"]
categories = ["command-line-utilities", "hardware-support"]
# Keep the published crate lean: the Python packaging and CI aren't needed
# to build it.
include = ["/src", "/tests", "/LICENSE", "/README.md"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
prometheus-client = "0.25"
smbmc = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
